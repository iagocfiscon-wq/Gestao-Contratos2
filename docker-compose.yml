services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cfiscon
      POSTGRES_USER: cfiscon
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - cfiscon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfiscon -d cfiscon"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cfiscon_pgdata:
